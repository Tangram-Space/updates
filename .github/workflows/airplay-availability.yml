# SPDX-License-Identifier: GPL-3.0-or-later
# Manual verification of the already published AirPlay 1.3.3 build 7 release.
# No build, publication, signing secret or macOS update is performed here.
name: AirPlay published release availability

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: airplay-release-availability
  cancel-in-progress: false

jobs:
  availability:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.repository == 'Tangram-Space/updates' &&
          github.ref == 'refs/heads/main' &&
          github.event.repository.private == false &&
          github.event.repository.visibility == 'public' &&
          vars.AIRPLAY_PUBLIC_CI_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Read the public verifier and exact release baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate the original verifier and checked-in release reference
        id: prepare
        run: |
          set -euo pipefail
          printf '%s\n' \
            'e3ecd21fca7a86d599077de4132bbcb4e48421755b453a0c82162ab4c103650d  ci/airplay/availability/release-1.3.3-7.json' \
            '76c86ca3bbb162ba6f2141a36db4f7225f3dd66466ebcf7c17e47ea28c8358cd  apps/airplay/source/scripts/verify-published-release.py' \
            'f6a15523085d6e2ca2756a5a1dfe3f4591126c8c72e0dab3cc86169c3bf11dc4  apps/airplay/source/scripts/update_release.py' | sha256sum --check --strict -
          AP_AVAILABILITY_ROOT="$(mktemp -d "$RUNNER_TEMP/airplay-availability-XXXXXX")"
          mkdir "$AP_AVAILABILITY_ROOT/release"
          cp ci/airplay/availability/release-1.3.3-7.json "$AP_AVAILABILITY_ROOT/release/release.json"
          cp feeds/airplay/stable/appcast.xml "$AP_AVAILABILITY_ROOT/release/appcast.xml"
          printf 'AP_AVAILABILITY_ROOT=%s\n' "$AP_AVAILABILITY_ROOT" >> "$GITHUB_ENV"
          export AP_AVAILABILITY_ROOT
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['AP_AVAILABILITY_ROOT']) / 'release'
          release = json.loads((root / 'release.json').read_text())
          if hashlib.sha256((root / 'appcast.xml').read_bytes()).hexdigest() != release['appcast_sha256']:
              raise SystemExit('The checked-in feed differs from the signed build 39636510520 reference.')
          PY

      - name: Download and validate the exact signed ZIP anonymously
        run: |
          set -euo pipefail
          if ! curl --disable --silent --fail --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --connect-timeout 20 --max-time 180 --retry 2 \
            --output "$AP_AVAILABILITY_ROOT/release/AirPlay-1.3.3-7.zip" \
            'https://github.com/Tangram-Space/updates/releases/download/airplay-v1.3.3-b7/AirPlay-1.3.3-7.zip'; then
            printf '%s\n' 'The public reference ZIP could not be downloaded over verified HTTPS.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['AP_AVAILABILITY_ROOT']) / 'release'
          release = json.loads((root / 'release.json').read_text())
          archive = root / release['archive']
          if archive.stat().st_size != release['archive_bytes'] or hashlib.sha256(archive.read_bytes()).hexdigest() != release['archive_sha256']:
              raise SystemExit('The downloaded ZIP differs from the signed build 39636510520 reference.')
          PY

      - name: Execute the unchanged anonymous HTTPS verifier
        id: verify
        run: |
          set -euo pipefail
          python3 apps/airplay/source/scripts/verify-published-release.py \
            --release-dir "$AP_AVAILABILITY_ROOT/release" \
            > "$AP_AVAILABILITY_ROOT/availability.json"
          cat "$AP_AVAILABILITY_ROOT/availability.json"

      - name: Preserve the real verifier result
        if: ${{ always() && (steps.verify.outcome == 'success' || steps.verify.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: airplay-release-availability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.AP_AVAILABILITY_ROOT }}/availability.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
